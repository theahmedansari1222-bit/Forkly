name: Forkly Part 1 - Design System Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-part1:
    name: Build & Test (API 37, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout forkly-code
        uses: actions/checkout@v4
        with:
          ref: forkly-code

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 17 / API 37 SDK components (official Google repository)
        shell: bash
        run: |
          set -euo pipefail
          echo "Using official Google Android SDK repository via sdkmanager."
          echo "Installing platforms;android-37.0 and build-tools;37.0.0 (compileSdk remains 37)..."
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "SDK installation commands completed."

      - name: Verify required SDK files
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying required API 37 / Build-Tools files..."
          missing=0
          check() {
            if [ -e "$1" ]; then
              echo "OK: $1"
            else
              echo "::error::Missing required SDK path: $1"
              missing=1
            fi
          }
          check "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          check "${ANDROID_HOME}/platforms/android-37.0/source.properties"
          check "${ANDROID_HOME}/build-tools/37.0.0"
          echo "---"
          echo "Installed platforms:"; ls -la "${ANDROID_HOME}/platforms" || true
          echo "Installed build-tools:"; ls -la "${ANDROID_HOME}/build-tools" || true
          echo "android-37.0 contents:"; ls -la "${ANDROID_HOME}/platforms/android-37.0" 2>/dev/null || true
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required SDK verification failed (android-37.0/android.jar, android-37.0/source.properties, build-tools/37.0.0). Reporting actual SDK state above; no other configuration changed."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble Debug APK (:app:assembleDebug)
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Run relevant unit tests (:app:testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forkly-part1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
