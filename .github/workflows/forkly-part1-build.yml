name: Forkly Part 1 - Design System Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-part1:
    name: Build & Test (API 37, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout forkly-code
        uses: actions/checkout@v4
        with:
          ref: forkly-code

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Check Android API 37 availability and install platform
        shell: bash
        run: |
          set -uo pipefail
          echo "Checking/installing Android API 37 (platforms;android-37) from configured SDK repositories..."
          LIST="$(sdkmanager --list 2>&1 || true)"
          if printf '%s\n' "$LIST" | grep -Eq '^[[:space:]]*platforms;android-37([[:space:]]|$|\|)'; then
            echo "Android API 37 package is listed. Installing platforms;android-37..."
          else
            echo "platforms;android-37 not found in listed packages; attempting install to confirm availability..."
          fi
          INSTALL_OUT="$(sdkmanager --install "platforms;android-37" 2>&1)"; INSTALL_RC=$?
          printf '%s\n' "$INSTALL_OUT"
          if [ $INSTALL_RC -ne 0 ] || printf '%s\n' "$INSTALL_OUT" | grep -q "Failed to find package 'platforms;android-37'"; then
            echo "::error::Android API 37 (platforms;android-37) is not available from the configured SDK repositories. Build stopped; compileSdk must remain 37 and no unofficial SDK/downgrade is used."
            exit 1
          fi
          if printf '%s\n' "$LIST" | grep -Eq '^[[:space:]]*build-tools;37(\.|[[:space:]]|$|\|)'; then
            BT="$(printf '%s\n' "$LIST" | awk '/^[[:space:]]*build-tools;37\.[0-9.]+/{gsub(/^[[:space:]]+/, "", $1); print $1}' | sort -V | tail -n1)"
            if [ -n "${BT:-}" ]; then
              echo "Installing compatible build tools: ${BT}"
              sdkmanager --install "${BT}"
            fi
          else
            echo "No build-tools;37.x package listed; continuing (AGP/build setup may resolve compatible tools if available)."
          fi
          echo "Installed platforms:"
          ls -la "${ANDROID_HOME}/platforms" || true
          echo "Installed build-tools:"
          ls -la "${ANDROID_HOME}/build-tools" || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble Debug APK (:app:assembleDebug)
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Run relevant unit tests (:app:testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forkly-part1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
